          <div class="col-md-6">
            <label class="form-label fw-semibold" for="Location">Location</label>

              <option value=""></option>
              <option value="0">Ahmedabad</option>

          <div class="col-md-6">
            <label class="form-label fw-semibold" for="Fuel_Type">Fuel Type</label>
            <select id="Fuel_Type" name="Fuel_Type" required>
              <option value=""></option>
              <option value="0">CNG</option>
              <option value="1">Diesel</option>
              <option value="2">Electric</option>
              <option value="3">LPG</option>
              <option value="4">Petrol</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold" for="Transmission">Transmission</label>
            <select id="Transmission" name="Transmission" required>
              <option value=""></option>
              <option value="0">Manual</option>
              <option value="1">Automatic</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold" for="Owner_Type">Owner Type</label>
            <select id="Owner_Type" name="Owner_Type" required>
              <option value=""></option>
              <option value="1">First</option>
              <option value="2">Second</option>
              <option value="3">Third</option>
              <option value="4">Fourth &amp; Above</option>
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold" for="Year">Year</label>
            <input type="number" class="form-control" id="Year" name="Year" min="1990" max="2026" step="1" placeholder="e.g. 2015" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold" for="Car_Age">Car Age (years)</label>
            <input type="number" class="form-control bg-light" id="Car_Age" name="Car_Age" readonly placeholder="Auto from Year">
            <div class="form-text">Calculated as 2026 − Year.</div>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold" for="Kilometers_Driven">Kilometers Driven</label>
            <input type="number" class="form-control" id="Kilometers_Driven" name="Kilometers_Driven" min="0" step="1" placeholder="e.g. 45000" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold" for="Mileage">Mileage (kmpl / km/kg)</label>
            <input type="number" class="form-control" id="Mileage" name="Mileage" min="0" step="0.01" placeholder="e.g. 18.2" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold" for="Engine">Engine (CC)</label>
            <input type="number" class="form-control" id="Engine" name="Engine" min="0" step="1" placeholder="e.g. 1199" required>
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold" for="Power">Power (bhp)</label>
            <input type="number" class="form-control" id="Power" name="Power" min="0" step="0.01" placeholder="e.g. 88.7" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold" for="Seats">Seats</label>
            <input type="number" class="form-control" id="Seats" name="Seats" min="2" max="14" step="1" placeholder="e.g. 5" required>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold" for="Has_New_Price">New price listed?</label>
            <select id="Has_New_Price" name="Has_New_Price" required>
              <option value=""></option>
              <option value="1">Yes</option>
              <option value="0">No</option>
            </select>
          </div>

        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary px-4">Predict price</button>
        </div>
      </form>
    {{ result }}
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
  ["Brand", "Model", "Location", "Fuel_Type", "Transmission", "Owner_Type", "Has_New_Price"].forEach(function (id) {
    new TomSelect("#" + id, {
      placeholder: "Select or search...",
      allowEmptyOption: true,
      maxOptions: null
    });
  });

  // Car_Age = 2026 - Year (same formula used when training)
  document.getElementById("Year").addEventListener("input", function () {
    var y = parseInt(this.value, 10);
    document.getElementById("Car_Age").value = isNaN(y) ? "" : 2026 - y;
  });
</script>
